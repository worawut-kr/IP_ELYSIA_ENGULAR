<div class="login-container">
    <form (ngSubmit)="onSubmit()" [formGroup]="form" autocomplete="off">
  
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput type="text" placeholder="username" (input)="updateErrorMessages('username')">
        <mat-error *ngIf="form.controls['username'].invalid">{{ errorMessages.username() }}</mat-error>
      </mat-form-field>
  
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" placeholder="password" (input)="updateErrorMessages('password')">
        <mat-error *ngIf="form.controls['password'].invalid">{{ errorMessages.password() }}</mat-error>
      </mat-form-field>
      
    </form>
  </div>
